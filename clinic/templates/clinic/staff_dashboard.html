{% extends 'clinic/base.html' %}
{% block title %}Staff Dashboard{% endblock %}
{% block content %}
<section style="padding: 4rem 0; background: #F8FAFC; min-height: 60vh;">
  <div class="container">
    <h2 style="color: #0F766E; margin-bottom: 2rem;">Staff Dashboard</h2>
    <p>Welcome, Dr. {{ request.user.get_full_name|default:request.user.username }}!</p>
    {% if doctor %}
      <p>Specialty: {{ doctor.specialty }}</p>
    {% endif %}
    <a href="{% url 'admin:index' %}" class="btn btn-primary">Go to Admin Panel</a>
  </div>
</section>
{% endblock %}
