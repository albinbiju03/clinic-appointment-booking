{% extends 'clinic/base.html' %}
{% block title %}Patient Registration{% endblock %}
{% block content %}
<section style="padding: 4rem 0; background: #F8FAFC; min-height: 60vh;">
  <div class="container" style="max-width: 500px; margin: 0 auto;">
    <h2 style="text-align: center; color: #0F766E; margin-bottom: 2rem;">Create Your Account</h2>
    <form method="post" style="background: #fff; padding: 2rem; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.06);">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">Already have an account? <a href="{% url 'clinic:patient_login' %}" style="color: #6366F1;">Login here</a></p>
  </div>
</section>
{% endblock %}
